<!DOCTYPE html>
<html lang="zh-CN" class="popup-html">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宜忌月历 · 摸鱼账本</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/mascots.css" />
</head>
<body class="popup-body">
  <div class="mini-app">
    <!-- 顶部横幅：小猫小鱼 · 标题 · 今日金句 -->
    <header class="banner mini-banner">
      <div class="banner-deco banner-deco-left"><img src="assets/mascot-cat.svg" alt="打盹摸鱼小猫" class="mascot-inline" /></div>
      <div class="banner-text">
        <span class="banner-kicker">宜忌月历 · 摸鱼账本</span>
        <h1 class="banner-title">我的宜忌月历 <em>摸鱼不紧张</em></h1>
      </div>
      <div class="banner-deco banner-deco-right"><img src="assets/mascot-fish.svg" alt="摸鱼小鱼" class="mascot-inline" />
        <span class="mf-bubbles"><span>🫧</span><span>🫧</span><span>🫧</span></span>
      </div>
      <p class="mini-fortune" id="mini-fortune-text">🐟 今日摸鱼 · 明日摸鱼</p>
    </header>

    <!-- 1. 今日宜忌 -->
    <section class="mini-card mini-yiji" aria-label="今日宜忌">
      <div class="mini-head">
        <span class="mini-head-title">今日宜忌</span>
        <span class="mini-date" id="mini-date"></span>
      </div>
      <div class="mini-yiji-cols">
        <div class="mini-row mini-yi">
          <i class="chip chip-yi">宜</i>
          <span id="mini-yi-text">…</span>
        </div>
        <div class="mini-row mini-ji">
          <i class="chip chip-ji">忌</i>
          <span id="mini-ji-text">…</span>
        </div>
      </div>
    </section>

    <!-- 2. 摸鱼账本：今天 -->
    <section class="mini-card mini-book" aria-label="今日摸鱼账本">
      <div class="mini-head">
        <span class="mini-head-title">摸鱼账本</span>
        <span class="mini-sub">今天</span>
      </div>
      <div class="mini-book-rows">
        <div class="mini-book-row">
          <span>今日已摸</span>
          <b id="mini-today-time">00:00</b>
        </div>
        <div class="mini-book-row">
          <span>今日入账</span>
          <b class="amt" id="mini-today-amount">0.00 元</b>
        </div>
      </div>
    </section>

    <!-- 3. 开始摸鱼框：紧凑计时器 -->
    <section class="mini-card mini-timer" id="mini-timer-card" data-state="idle" aria-label="摸鱼计时器">
      <div class="mini-timer-top">
        <span class="mini-timer-label">给今天摸鱼</span>
        <span class="status-chip" id="mini-status-chip">未开始</span>
      </div>
      <div class="mini-timer-main">
        <span class="mini-time" id="mini-time-text">00:00:00</span>
        <span class="mini-amount" id="mini-amount-text">0.00 元</span>
      </div>
      <p id="mini-rate-error" class="error-msg" role="alert"></p>
      <div class="mini-controls" id="mini-controls">
        <button class="btn btn-start" id="btn-start">开始摸鱼</button>
        <button class="btn btn-pause is-hidden" id="btn-pause">暂停</button>
        <button class="btn btn-start is-hidden" id="btn-resume">继续摸鱼</button>
        <button class="btn btn-reset is-hidden" id="btn-reset">重置</button>
      </div>
    </section>

    <!-- 4. 健康提醒设置 -->
    <section class="mini-card mini-water" aria-label="健康提醒设置">
      <div class="mini-head">
        <span class="mini-head-title">健康小提醒</span>
        <label class="water-switch" title="启用/禁用提醒">
          <input type="checkbox" id="water-enabled" />
          <span class="water-slider"></span>
        </label>
      </div>
      <div class="water-rows">
        <div class="water-row">
          <span class="water-label">提醒间隔</span>
          <select id="water-interval" class="water-select">
            <option value="5">5 分钟</option>
            <option value="15">15 分钟</option>
            <option value="30" selected>30 分钟</option>
            <option value="60">60 分钟</option>
            <option value="custom">自定义</option>
          </select>
          <input type="number" id="water-custom" class="water-custom is-hidden" min="1" max="480" step="1" placeholder="分钟" />
        </div>
        <div class="water-row">
          <span class="water-label">提示音</span>
          <label class="water-switch water-switch-sm" title="弹出时播放提示音">
            <input type="checkbox" id="water-sound" checked />
            <span class="water-slider"></span>
          </label>
        </div>
        <div class="water-row">
          <span class="water-label">静音时段</span>
          <label class="water-switch water-switch-sm" title="该时段内不提醒">
            <input type="checkbox" id="water-quiet-enabled" />
            <span class="water-slider"></span>
          </label>
        </div>
        <div class="water-row water-quiet-range is-hidden" id="water-quiet-range">
          <span class="water-label">时段</span>
          <input type="time" id="water-quiet-start" class="water-time" value="22:00" />
          <span class="water-dash">–</span>
          <input type="time" id="water-quiet-end" class="water-time" value="08:00" />
        </div>
        <div class="water-col">
          <span class="water-label">白名单网站（每行一个域名，如 youtube.com）</span>
          <textarea id="water-whitelist" class="water-textarea" rows="2" placeholder="youtube.com&#10;bilibili.com"></textarea>
        </div>
      </div>
      <div class="water-stats" aria-label="今日提醒统计">
        <div class="water-stat"><b id="water-stat-remind">0</b><span>提醒</span></div>
        <div class="water-stat"><b id="water-stat-snooze">0</b><span>稍后</span></div>
        <div class="water-stat"><b id="water-stat-dismiss">0</b><span>关闭</span></div>
      </div>
    </section>

    <!-- 打开完整页面 -->
    <button class="btn btn-full" id="btn-open-full" type="button">🗓️ 查看全部日历 / 调整摸鱼身价</button>
  </div>

  <script src="js/yiji-data.js"></script>
  <script src="js/moyu-timer.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/achievement-engine.js"></script>
  <script src="js/mini.js"></script>
</body>
</html>
