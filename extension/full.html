<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宜忌月历 · 摸鱼账本</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/mascots.css" />
</head>
<body>
  <div class="app">
    <!-- 顶部横幅：猫与鱼 · 可爱月历 -->
    <header class="banner">
      <div class="banner-deco banner-deco-left"><img src="assets/mascot-cat.svg" alt="打盹摸鱼小猫" class="mascot-inline" /></div>
      <div class="banner-text">
        <span class="banner-kicker">宜忌月历 · 摸鱼账本</span>
        <h1 class="banner-title">我的宜忌月历 <em>摸鱼不紧张</em></h1>
      </div>
      <div class="banner-fortune" id="banner-fortune">
        <span class="fortune-cat"><img src="assets/mascot-fish.svg" alt="摸鱼小鱼" class="mascot-inline" /></span>
        <span class="fortune-text" id="fortune-text">🐟 今日摸鱼 · 明日摸鱼</span>
      </div>
      <div class="banner-deco banner-deco-right"><img src="assets/mascot-fish.svg" alt="摸鱼小鱼" class="mascot-inline" />
        <span class="mf-bubbles"><span>🫧</span><span>🫧</span><span>🫧</span></span>
      </div>
    </header>

    <!-- 月汇总卡片 -->
    <div class="month-summary" id="cal-summary">
      <span class="month-summary-label">📊 本月累计</span>
      <span class="month-summary-item"><span class="month-summary-k">摸鱼</span><b id="cal-summary-time">—</b></span>
      <span class="month-summary-item"><span class="month-summary-k">入账</span><b id="cal-summary-amount">—</b></span>
      <div class="month-summary-deco">
        <img src="assets/mascot-cat.svg" alt="" class="summary-mascot summary-cat" />
        <img src="assets/mascot-fish.svg" alt="" class="summary-mascot summary-fish" />
      </div>
    </div>

    <!-- 月历主体 -->
    <main class="calendar-wrap" aria-label="宜忌月历">
      <div class="cal-toolbar">
        <button class="cal-nav" id="cal-prev" type="button" aria-label="上一月">‹</button>
        <button class="cal-hl" id="cal-today" type="button">今天</button>
        <button class="cal-nav" id="cal-next" type="button" aria-label="下一月">›</button>
        <h2 class="cal-title" id="cal-title">0000年 00月</h2>
      </div>

      <div class="cal-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span>
        <span>四</span><span>五</span><span>六</span>
      </div>

      <div class="cal-grid" id="cal-grid"></div>

      <div class="cal-legend">
        <span><i class="dot dot-yi">宜</i>适合</span>
        <span><i class="dot dot-ji">忌</i>避开</span>
        <span><i class="dot dot-fish">🐟</i>已有摸鱼记录</span>
      </div>
    </main>

    <!-- 设置面板：薪资模型（位于月历下方，默认展开） -->
    <section class="settings" id="settings-panel" data-open="true" aria-label="薪资设置">
      <button class="settings-toggle" id="settings-toggle" type="button" aria-expanded="true">
        <span>⚙️ 摸鱼身价</span><span class="settings-arrow">▾</span>
      </button>
      <div class="settings-body" id="settings-body">
        <div class="settings-grid">
          <div class="field field-rate">
            <label for="rate-input">时薪（手填优先）</label>
            <div class="field-input">
              <input id="rate-input" type="text" placeholder="如 56.8" />
              <span class="unit">元/时</span>
            </div>
            <p class="field-hint">留空则用下方月薪推算等效时薪</p>
          </div>

          <div class="field">
            <label for="salary-input">月薪</label>
            <div class="field-input">
              <input id="salary-input" type="text" placeholder="10000" />
              <span class="unit">元</span>
            </div>
          </div>

          <div class="field">
            <label for="workdays-input">月工作天数</label>
            <div class="field-input">
              <input id="workdays-input" type="text" placeholder="22" />
              <span class="unit">天</span>
            </div>
          </div>

          <div class="field">
            <label for="hours-input">每天工作时长</label>
            <div class="field-input">
              <input id="hours-input" type="text" placeholder="8" />
              <span class="unit">小时</span>
            </div>
          </div>
        </div>
        <div class="settings-foot">
          <p class="effective-rate" id="effective-rate" role="status">
            等效时薪：月薪 ÷ 工作天数 ÷ 每天时长
          </p>
          <button class="btn btn-save" id="settings-save" type="button">保存设置</button>
        </div>
        <p id="settings-error" class="settings-error" role="alert"></p>
      </div>
    </section>

    <!-- 计时器：为"今天"记一笔账 -->
    <section class="timer-wrap" id="timer-card" data-state="idle" aria-label="摸鱼计时器">
      <div class="timer-head">
        <span class="pane-kicker">给今天摸鱼</span>
        <h2 class="pane-title">计时一笔</h2>
        <span class="status-chip" id="status-chip">未开始</span>
      </div>

      <div class="timer-card">
        <div class="timer-main">
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 240 240" role="img" aria-label="计时进度">
              <circle class="ring-track" cx="120" cy="120" r="108" />
              <circle class="ring-progress" id="ring-progress" cx="120" cy="120" r="108" transform="rotate(-90 120 120)" />
            </svg>
            <div class="ring-center">
              <span class="ring-label" id="ring-label">今日摸鱼</span>
              <div id="time-text" class="time-text">00:00:00</div>
              <div id="amount-text" class="amount-text">0.00 元</div>
            </div>
          </div>
          <div class="timer-today" id="timer-today"></div>
        </div>

        <p id="rate-error" class="error-msg" role="alert"></p>
        <div id="timer-controls" class="controls">
          <button class="btn btn-start" id="btn-start">开始摸鱼</button>
          <button class="btn btn-pause is-hidden" id="btn-pause">暂停</button>
          <button class="btn btn-start is-hidden" id="btn-resume">继续摸鱼</button>
        </div>
        <p class="pane-note">🐟 一秒摸鱼一秒金 · 记进今天的日子格</p>
      </div>
    </section>

    <section class="achievements" id="achievements-panel" aria-label="摸鱼成就">
      <div class="achievements-head">
        <div>
          <span class="achievements-kicker">🏅 摸鱼成就</span>
          <h2>鱼塘荣誉墙</h2>
        </div>
        <div class="achievements-head-right">
          <button type="button" class="achievements-refresh" id="achievements-refresh">🔄 刷新成就</button>
          <span class="achievements-count" id="achievements-count">0 / 0</span>
        </div>
      </div>
      <div class="achievements-grid" id="achievements-grid"></div>
    </section>
  </div>

  <script src="js/calendar-tooltip.js"></script>
  <script src="js/yiji-data.js"></script>
  <script src="js/moyu-timer.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/achievement-engine.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
